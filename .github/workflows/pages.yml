name: Publish to emroze.dev/fortress-group

# emroze.dev is built by project-lambda/apps; this asks that repo to rebuild (which pulls this repo in).
# Needs a repo secret APPS_DISPATCH_TOKEN: a fine-grained PAT with "Contents: read and write" on project-lambda/apps.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger apps deploy
        env:
          TOKEN: ${{ secrets.APPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "APPS_DISPATCH_TOKEN not set; run the apps 'Deploy to GitHub Pages' workflow manually."; exit 0; fi
          curl -sS -f -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/project-lambda/apps/dispatches \
            -d '{"event_type":"fortress-group-updated"}'
